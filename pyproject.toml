[project]
name = "weight-sync-bench"
version = "0.1.0"
description = "Resharding correctness harness for tensor-parallel weight synchronization"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

# Phase 2 (vLLM, GPU) is deliberately NOT declared as a [project.optional-
# dependencies] extra here. `uv sync` resolves one universal lock across every
# extra even when you only install a subset, and vllm==0.28.0's own dependency
# chain (via mistral-common) caps numpy below phase 1's pinned 2.4.6 -- adding it
# as an extra makes the existing lock unsatisfiable. See
# src/weight_sync_bench/phase2/bf16_floor.py's module docstring for the pinned
# version and the separate-environment install command for the GPU box.

# prime-rl is recorded as inert data, never as a dependency, for exactly the
# reason stated above for vLLM: `uv sync` resolves one universal lock across
# every extra even when only a subset is installed, and this dependency chain
# is unsatisfiable against phase 1's pinned numpy==2.4.6. prime-rl additionally
# marks its whole chain `sys_platform == 'linux'`, so it does not install on a
# development macOS box at all. No resolver reads a `[tool.*]` table, so nothing
# here can perturb the lock. `weight_sync_bench.phase3.pin` is the only reader.
#
# This commit was chosen over a release tag because its `uv.lock` resolves
# vllm==0.28.0, the version phase 2's bf16 floor and Qwen3 layout table were
# both measured at; v0.9.0 resolves vllm==0.26.0+cu129 and would force a floor
# re-measurement. Do not bump without re-measuring.
[tool.weight_sync_bench.phase3]
prime_rl_commit = "26b3131d2716a4f8210b165df584b83b4bc54f61"
prime_rl_tag = "v0.9.1.dev41"
prime_rl_pinned_date = "2026-09-04"
vllm_version = "0.28.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_sync_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always surface a stale-tolerance-environment warning; never let it be deduplicated
# away, and never let -W error turn it into a failure.
filterwarnings = [
    "always::weight_sync_bench.tolerance.EnvironmentMismatch",
]
