[project]
name = "weight-sync-bench"
version = "0.1.0"
description = "Resharding correctness harness for tensor-parallel weight synchronization"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

# Phase 2 (vLLM, GPU) is deliberately NOT declared as a [project.optional-
# dependencies] extra here. `uv sync` resolves one universal lock across every
# extra even when you only install a subset, and vllm==0.28.0's own dependency
# chain (via mistral-common) caps numpy below phase 1's pinned 2.4.6 -- adding it
# as an extra makes the existing lock unsatisfiable. See
# src/weight_sync_bench/phase2/bf16_floor.py's module docstring for the pinned
# version and the separate-environment install command for the GPU box.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_sync_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always surface a stale-tolerance-environment warning; never let it be deduplicated
# away, and never let -W error turn it into a failure.
filterwarnings = [
    "always::weight_sync_bench.tolerance.EnvironmentMismatch",
]
